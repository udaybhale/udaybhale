<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8; }
        .text { font-family: 'Courier New', monospace; fill: #c9d1d9; }
        .title { font-size: 16px; font-weight: bold; fill: #00ffff; }
        @keyframes expand { from { width: 0; } }
        .bar { animation: expand 1.5s ease-out forwards; }
    </style>
    <rect class="bg" width="398" height="198" x="1" y="1" />
    <text x="20" y="30" class="text title">> Top Languages</text>
    
    <g transform="translate(20, 60)">
        <text x="0" y="12" class="text" font-size="12">Python</text>
        <rect x="80" y="3" width="280" height="10" fill="#21262d" rx="3"/>
        <rect class="bar" x="80" y="3" width="180" height="10" fill="#3572A5" rx="3"/>
        
        <text x="0" y="42" class="text" font-size="12">Shell</text>
        <rect x="80" y="33" width="280" height="10" fill="#21262d" rx="3"/>
        <rect class="bar" x="80" y="33" width="140" height="10" fill="#89e051" rx="3"/>
        
        <text x="0" y="72" class="text" font-size="12">HTML</text>
        <rect x="80" y="63" width="280" height="10" fill="#21262d" rx="3"/>
        <rect class="bar" x="80" y="63" width="100" height="10" fill="#e34c26" rx="3"/>
        
        <text x="0" y="102" class="text" font-size="12">JavaScript</text>
        <rect x="80" y="93" width="280" height="10" fill="#21262d" rx="3"/>
        <rect class="bar" x="80" y="93" width="80" height="10" fill="#f1e05a" rx="3"/>
    </g>
</svg>
