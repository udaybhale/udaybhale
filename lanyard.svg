<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
    <style>
        @keyframes swing {
            0% { transform: rotate(5deg); }
            50% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
        .card { fill: #111; stroke: #333; stroke-width: 2; rx: 15; }
        .strap { fill: none; stroke: #0f0; stroke-width: 12; stroke-linecap: round; }
        .text-main { font-family: 'Courier New', monospace; font-size: 24px; font-weight: bold; fill: #fff; }
        .text-sub { font-family: 'Courier New', monospace; font-size: 16px; fill: #0f0; }
        .text-desc { font-family: 'Courier New', monospace; font-size: 14px; fill: #888; }
    </style>
    <defs>
        <pattern id="carbon" width="10" height="10" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#1a1a1a"/>
            <path d="M0,5 L10,15 M-5,10 L5,20 M5,0 L15,10" stroke="#222" stroke-width="2"/>
        </pattern>
        <clipPath id="circle-clip">
            <circle cx="200" cy="250" r="70" />
        </clipPath>
        <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffff" />
            <stop offset="100%" stop-color="#0f0" />
        </linearGradient>
    </defs>
    
    <g style="transform-origin: 200px -100px; animation: swing 4s ease-in-out infinite;">
        <!-- Strap -->
        <path class="strap" d="M160,-100 L180,80" />
        <path class="strap" d="M240,-100 L220,80" />
        
        <!-- Clasp -->
        <rect x="175" y="70" width="50" height="30" fill="#555" rx="5" />
        <rect x="185" y="100" width="30" height="20" fill="#777" rx="3" />
        
        <!-- Card -->
        <rect x="50" y="110" width="300" height="450" class="card" fill="url(#carbon)" />
        <rect x="60" y="120" width="280" height="430" fill="none" stroke="#0f0" stroke-width="1" rx="10" stroke-dasharray="5 5" />
        
        <text x="200" y="150" class="text-sub" text-anchor="middle">ACCESS GRANTED</text>
        <line x1="100" y1="165" x2="300" y2="165" stroke="#333" stroke-width="2" />
        
        <!-- Avatar -->
        <circle cx="200" cy="250" r="75" fill="none" stroke="#00ffff" stroke-width="3" />
        
        <!-- REPLACE THE DATA URI BELOW WITH YOUR ACTUAL BASE64 IMAGE -->
        <image href="character.png" x="130" y="180" width="140" height="140" clip-path="url(#circle-clip)" />
        
        <!-- Details -->
        <text x="200" y="360" class="text-main" text-anchor="middle">UDAY BHALE</text>
        <text x="200" y="385" class="text-sub" text-anchor="middle">Ethical Hacker</text>
        <text x="200" y="410" class="text-desc" text-anchor="middle">@udaybhale</text>
        
        <!-- Barcode / QR Placeholder -->
        <rect x="100" y="440" width="200" height="40" fill="#fff" />
        <g fill="#000" transform="translate(105, 440)">
            <rect x="0" width="5" height="40"/><rect x="10" width="2" height="40"/><rect x="15" width="8" height="40"/>
            <rect x="30" width="4" height="40"/><rect x="40" width="10" height="40"/><rect x="55" width="2" height="40"/>
            <rect x="65" width="12" height="40"/><rect x="85" width="3" height="40"/><rect x="95" width="7" height="40"/>
            <rect x="110" width="4" height="40"/><rect x="120" width="15" height="40"/><rect x="140" width="2" height="40"/>
            <rect x="150" width="8" height="40"/><rect x="165" width="5" height="40"/><rect x="180" width="10" height="40"/>
        </g>
        <text x="200" y="505" class="text-desc" font-size="10" text-anchor="middle">ID: UDB-001-SEC</text>
        
        <!-- Cyber Holographic Shine -->
        <rect x="50" y="110" width="300" height="450" fill="url(#neonGlow)" opacity="0.05" rx="15" />
    </g>
</svg>
